name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      pilot_page_limit:
        description: 'Optional: limit number of published pages for pilot runs'
        required: false
        type: string

jobs:
  publish_and_deploy:
    runs-on: ubuntu-latest
    name: Publish and Deploy SharePoint Content
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Restore publish cache
        id: restore-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            .cache
            dist
          key: sharepoint-publish-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            sharepoint-publish-${{ github.ref_name }}-

      - name: Sync published SharePoint pages
        env:
          SP_TENANT_ID: ${{ secrets.SP_TENANT_ID }}
          SP_CLIENT_ID: ${{ secrets.SP_CLIENT_ID }}
          SP_CLIENT_SECRET: ${{ secrets.SP_CLIENT_SECRET }}
          SP_TENANT_HOST: ${{ secrets.SP_TENANT_HOST }}
          SP_SITE_PATH: ${{ secrets.SP_SITE_PATH }}
          PUBLIC_BASE_URL: https://groveguidance.uebt.org
          PILOT_PAGE_LIMIT: ${{ inputs.pilot_page_limit }}
        run: npm run publish:sync

      - name: Validate generated static output
        env:
          STATE_FILE: .cache/sharepoint-sync-state.json
        run: npm run publish:validate

      - name: Save publish cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            .cache
            dist
          key: sharepoint-publish-${{ github.ref_name }}-${{ github.run_id }}

      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_VICTORIOUS_STONE_0501FF610 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: dist
          api_location: ''
          output_location: ''
